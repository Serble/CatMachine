<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dd7c4"/>
      <stop offset="1" stop-color="#14a594"/>
    </linearGradient>
  </defs>

  <!-- CPU pins (tucked under the chip so only the outer ends show) -->
  <g fill="#f5b544">
    <!-- left -->
    <rect x="14" y="44" width="18" height="7" rx="2"/>
    <rect x="14" y="60" width="18" height="7" rx="2"/>
    <rect x="14" y="76" width="18" height="7" rx="2"/>
    <!-- right -->
    <rect x="96" y="44" width="18" height="7" rx="2"/>
    <rect x="96" y="60" width="18" height="7" rx="2"/>
    <rect x="96" y="76" width="18" height="7" rx="2"/>
    <!-- bottom -->
    <rect x="44" y="92" width="7" height="18" rx="2"/>
    <rect x="60" y="92" width="7" height="18" rx="2"/>
    <rect x="76" y="92" width="7" height="18" rx="2"/>
    <!-- top -->
    <rect x="44" y="18" width="7" height="18" rx="2"/>
    <rect x="60" y="18" width="7" height="18" rx="2"/>
    <rect x="76" y="18" width="7" height="18" rx="2"/>
  </g>

  <!-- Tail (behind body, simple curl with no self-overlap) -->
  <path d="M96 88c15 4 24-2 22-15-1-8-9-11-13-5" fill="none"
        stroke="#0c5c53" stroke-width="14" stroke-linecap="round"/>
  <path d="M96 88c15 4 24-2 22-15-1-8-9-11-13-5" fill="none"
        stroke="#0f8478" stroke-width="9" stroke-linecap="round"/>

  <!-- Ears -->
  <path d="M30 44 34 18 58 34Z" fill="#2fc9b6" stroke="#0c5c53" stroke-width="3" stroke-linejoin="round"/>
  <path d="M98 44 94 18 70 34Z" fill="#2fc9b6" stroke="#0c5c53" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 38 40 26 50 34Z" fill="#0f8478"/>
  <path d="M90 38 88 26 78 34Z" fill="#0f8478"/>

  <!-- Chip / head body -->
  <rect x="28" y="30" width="72" height="68" rx="16" fill="url(#chip)" stroke="#0c5c53" stroke-width="3"/>

  <!-- Eyes: LED / screen style -->
  <g>
    <rect x="42" y="50" width="15" height="15" rx="4" fill="#0c3b36"/>
    <rect x="71" y="50" width="15" height="15" rx="4" fill="#0c3b36"/>
    <rect x="45" y="53" width="5" height="5" rx="1.5" fill="#a7f0e5"/>
    <rect x="74" y="53" width="5" height="5" rx="1.5" fill="#a7f0e5"/>
  </g>

  <!-- Mouth: cat-style -->
  <g fill="none" stroke="#0c5c53" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 74v3M64 77c-2 3-6 3-8 0M64 77c2 3 6 3 8 0"/>
  </g>

  <!-- Whiskers -->
  <g fill="none" stroke="#0c5c53" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M48 75 37 69M48 78 36 78M48 81 37 87M80 75 91 69M80 78 92 78M80 81 91 87"/>
  </g>
</svg>
